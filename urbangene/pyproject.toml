[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbangene"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy", "Pillow", "PyYAML", "matplotlib"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
urbangene = "urbangene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
