[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbangene-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy", "Pillow", "PyYAML", "scipy"]

[project.optional-dependencies]
backbone = ["transformers>=4.56", "safetensors"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "/root/code/urban-visual-gene/urbangene/src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
